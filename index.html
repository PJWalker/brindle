<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Keeper's Desk">
<title>Keeper's Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn only-phone" data-act="nav-toggle" aria-label="Menu">☰</button>
    <div class="brand" data-act="go" data-to="#/play">
      <span class="brand-text"><span class="brand-title">Keeper's Desk</span><span class="brand-sub" id="brandSub"></span></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" data-act="search" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
      <button class="pill-btn" data-act="moves-sheet">Moves</button>
      <button class="icon-btn" data-act="theme" aria-label="Invert colours"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="scrim" id="scrim" data-act="close-overlays"></div>
<aside class="sheet" id="sheet" aria-hidden="true"></aside>
<dialog id="modal"></dialog>
<div id="toast" role="status"></div>
<script src="js/seed.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
